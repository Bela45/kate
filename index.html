<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katelyn Learns Math! 🎓</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-image {
            max-width: 150px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .emoji {
            font-size: 3em;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .main-menu {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .main-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 25px;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .main-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .main-btn.tutorial {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .level-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .level-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .level-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .level-btn.addition {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .level-btn.subtraction {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .level-btn.multiplication {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .level-btn.division {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
        }

        .tutorial-area, .quiz-area, .level-selection {
            display: none;
        }

        .tutorial-area.active, .quiz-area.active, .level-selection.active {
            display: block;
        }

        .tutorial-content {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .tutorial-content h2 {
            color: #333;
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
        }

        .tutorial-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .tutorial-section h3 {
            color: #667eea;
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .tutorial-section p {
            color: #333;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .example-box {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 5px solid #43e97b;
        }

        .example-box .math-example {
            font-size: 1.8em;
            font-weight: bold;
            color: #155724;
            text-align: center;
            margin: 10px 0;
        }

        .tip-box {
            background: linear-gradient(135deg, #fff7e6 0%, #ffe9b3 100%);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 5px solid #ffa726;
        }

        .tip-box strong {
            color: #ff6f00;
        }

        .question-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .question {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .answer-input {
            width: 200px;
            padding: 15px;
            font-size: 1.5em;
            border: 3px solid #667eea;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .hidden-answer {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 2px dashed #ccc;
            cursor: pointer;
            transition: all 0.3s;
        }

        .hidden-answer:hover {
            background: #e0e0e0;
        }

        .hidden-answer.revealed {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            border: 2px solid #43e97b;
        }

        .answer-text {
            font-size: 1.3em;
            color: #333;
            font-weight: bold;
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
        }

        .feedback.correct {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #155724;
        }

        .feedback.incorrect {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #721c24;
        }

        .score {
            text-align: center;
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .back-btn {
            background: #6c757d;
        }

        /* Long Division Bracket Style */
        .long-division {
            display: inline-block;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #155724;
            margin: 10px auto;
        }

        .long-division .ld-quotient {
            display: block;
            text-align: right;
            padding-right: 8px;
            border-bottom: 3px solid #155724;
            padding-bottom: 4px;
            margin-bottom: 4px;
            color: #764ba2;
        }

        .long-division .ld-body {
            display: flex;
            align-items: center;
        }

        .long-division .ld-divisor {
            padding-right: 6px;
            border-right: 3px solid #155724;
        }

        .long-division .ld-dividend {
            padding-left: 8px;
            border-top: 3px solid #155724;
            padding-top: 4px;
        }

        /* Quiz vertical division */
        .long-division-quiz {
            display: inline-block;
            font-size: 2.2em;
            font-weight: bold;
            color: #333;
            margin: 10px auto 20px;
        }

        .long-division-quiz .ldq-quotient {
            display: block;
            text-align: right;
            padding-right: 8px;
            border-bottom: 3px solid #333;
            padding-bottom: 4px;
            margin-bottom: 4px;
            color: #764ba2;
        }

        .long-division-quiz .ldq-body {
            display: flex;
            align-items: center;
        }

        .long-division-quiz .ldq-divisor {
            padding-right: 8px;
            border-right: 3px solid #333;
        }

        .long-division-quiz .ldq-dividend {
            padding-left: 10px;
            border-top: 3px solid #333;
            padding-top: 4px;
        }

        .vertical-math {
            display: inline-block;
            text-align: right;
            font-size: 1.8em;
            font-weight: bold;
            color: #155724;
            background: white;
            border-radius: 10px;
            padding: 15px 25px;
            margin: 10px auto;
            border-bottom: 4px solid #155724;
            min-width: 120px;
        }

        .vertical-math .vm-num1,
        .vertical-math .vm-num2-row,
        .vertical-math .vm-answer {
            display: block;
            line-height: 1.4;
        }

        .vertical-math .vm-num2-row {
            border-bottom: 3px solid #155724;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .vertical-math .vm-operator {
            margin-right: 5px;
            color: #764ba2;
        }

        .vertical-example-box {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 5px solid #43e97b;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .vertical-example-box .horizontal-side {
            font-size: 1.6em;
            font-weight: bold;
            color: #155724;
            flex: 1;
            min-width: 120px;
        }

        .vertical-example-box .arrow {
            font-size: 2em;
            color: #764ba2;
        }

        .vertical-example-box .vertical-side {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        /* Vertical Quiz Question */
        .vertical-question-display {
            display: inline-block;
            text-align: right;
            font-size: 2.2em;
            font-weight: bold;
            color: #333;
            margin: 10px auto 20px;
            min-width: 140px;
        }

        .vertical-question-display .vq-num1,
        .vertical-question-display .vq-num2-row,
        .vertical-question-display .vq-answer-row {
            display: block;
            line-height: 1.5;
        }

        .vertical-question-display .vq-num2-row {
            border-bottom: 3px solid #333;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .vertical-question-display .vq-operator {
            margin-right: 5px;
            color: #764ba2;
        }

        .vertical-question-display .vq-answer-row {
            color: #764ba2;
        }

        .question-format-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .format-btn {
            background: #e0e0e0;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95em;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .format-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* ===== TABLES SECTION ===== */
        .tables-tab-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 18px;
        }

        .tables-tab {
            background: #e8e8f0;
            border: none;
            padding: 10px 18px;
            border-radius: 20px 20px 0 0;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            color: #555;
            border-bottom: 3px solid transparent;
        }

        .tables-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom: 3px solid #764ba2;
        }

        .tables-number-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .num-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            background: #e8e8f0;
            color: #555;
            transition: all 0.2s;
        }

        .num-btn.active {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            transform: scale(1.1);
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 10px;
        }

        .table-card {
            background: linear-gradient(135deg, #f5f7ff 0%, #e8ecff 100%);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(102,126,234,0.15);
        }

        .table-card-header {
            padding: 10px;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            color: white;
        }

        .table-card-header.mult  { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .table-card-header.add   { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .table-card-header.sub   { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .table-card-header.div   { background: linear-gradient(135deg, #30cfd0 0%, #667eea 100%); }

        .table-card-row {
            padding: 7px 14px;
            font-size: 1em;
            color: #333;
            border-bottom: 1px solid #dde3ff;
        }

        .table-card-row:last-child {
            border-bottom: none;
        }

        .table-card-row:nth-child(even) {
            background: rgba(102,126,234,0.05);
        }

        /* ===== END TABLES SECTION ===== */

        /* ===== COUNTING NUMBERS SECTION ===== */
        .counting-range-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .counting-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .count-cell {
            border: none;
            border-radius: 12px;
            padding: 16px 4px;
            font-family: inherit;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .count-cell .cc-num {
            font-size: 2em;
            line-height: 1.1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .count-cell .cc-word {
            font-size: 0.75em;
            text-transform: uppercase;
            opacity: 0.95;
            letter-spacing: 0.3px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .count-cell:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(0,0,0,0.25);
        }

        .count-cell:active,
        .count-cell.speaking {
            transform: scale(0.93);
            box-shadow: 0 0 0 3px white inset, 0 5px 14px rgba(0,0,0,0.3);
        }

        .voice-status {
            text-align: center;
            color: #666;
            font-size: 0.95em;
            margin-bottom: 15px;
            min-height: 1.4em;
        }

        @media (max-width: 600px) {
            .counting-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        /* ===== END COUNTING NUMBERS SECTION ===== */

        @media (max-width: 600px) {
            .header-image {
                max-width: 120px;
            }

            h1 {
                font-size: 1.8em;
            }
            
            .question {
                font-size: 2em;
            }
            
            .level-select {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://i.imgur.com/RlLSTNS.png" alt="Katelyn Learns Math" class="header-image">
            <div class="emoji">🎓✨</div>
            <h1>Katelyn Learns Math!</h1>
            <p style="color: #666; font-size: 1.2em;">Let's learn and practice together!</p>
        </div>

        <!-- Main Menu -->
        <div id="mainMenu" class="main-menu">
            <button class="main-btn tutorial" onclick="showTutorialSelection()">
                📚 Learn Math (Tutorials)
            </button>
            <button class="main-btn" onclick="showTablesMenu()">
                📊 Times Tables & Charts
            </button>
            <button class="main-btn" onclick="showCountingMenu()" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                🔢 Counting Numbers 1-200
            </button>
            <button class="main-btn" onclick="showQuizSelection()">
                🎮 Practice Quiz
            </button>
        </div>

        <!-- Tutorial Selection -->
        <div id="tutorialSelection" class="level-selection">
            <h2 style="color: #667eea; text-align: center; margin-bottom: 20px;">Choose a Topic to Learn</h2>
            <div class="level-select">
                <button class="level-btn addition" onclick="showTutorial('addition')">
                    ➕ Addition
                </button>
                <button class="level-btn subtraction" onclick="showTutorial('subtraction')">
                    ➖ Subtraction
                </button>
                <button class="level-btn multiplication" onclick="showTutorial('multiplication')">
                    ✖️ Multiplication
                </button>
                <button class="level-btn division" onclick="showTutorial('division')">
                    ➗ Division
                </button>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn back-btn" onclick="backToMainMenu()">← Back to Main Menu</button>
            </div>
        </div>

        <!-- Quiz Selection -->
        <div id="quizSelection" class="level-selection">
            <h2 style="color: #667eea; text-align: center; margin-bottom: 20px;">Choose Your Quiz</h2>
            <div class="level-select">
                <button class="level-btn addition" onclick="startQuiz('addition')">
                    ➕ Addition
                </button>
                <button class="level-btn subtraction" onclick="startQuiz('subtraction')">
                    ➖ Subtraction
                </button>
                <button class="level-btn multiplication" onclick="startQuiz('multiplication')">
                    ✖️ Multiplication
                </button>
                <button class="level-btn division" onclick="startQuiz('division')">
                    ➗ Division
                </button>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn back-btn" onclick="backToMainMenu()">← Back to Main Menu</button>
            </div>
        </div>

        <!-- Tutorial Area -->
        <div id="tutorialArea" class="tutorial-area">
            <div id="tutorialContent"></div>
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn btn-secondary" onclick="startQuizFromTutorial()">Ready? Take the Quiz! 🎮</button>
                <button class="btn back-btn" onclick="backToTutorialSelection()">← Back to Tutorials</button>
            </div>
        </div>

        <!-- Quiz Area -->
        <div id="quizArea" class="quiz-area">
            <div class="score">
                Score: <span id="score">0</span> / <span id="total">0</span> 🌟
            </div>

            <div class="question-card">
                <div class="question-format-toggle">
                    <button class="format-btn active" id="btnHorizontal" onclick="setFormat('horizontal')">➡️ Horizontal</button>
                    <button class="format-btn" id="btnVertical" onclick="setFormat('vertical')">⬇️ Vertical</button>
                </div>
                <div class="question" id="question"></div>
                <div id="questionVertical" style="display:none; text-align:center;">
                    <div class="vertical-question-display" id="questionVerticalDisplay"></div>
                </div>
                <input type="number" id="userAnswer" class="answer-input" placeholder="?" />
                <br>
                <button class="btn" onclick="checkAnswer()">Check Answer ✓</button>
                <button class="btn btn-secondary" onclick="nextQuestion()">Next Question →</button>
            </div>

            <div class="hidden-answer" id="hiddenBox" onclick="revealAnswer()">
                <p style="color: #666; margin-bottom: 10px;">📦 Click to reveal the answer</p>
                <div class="answer-text" id="correctAnswer" style="display: none;"></div>
            </div>

            <div id="feedback"></div>

            <div style="text-align: center; margin-top: 30px;">
                <button class="btn back-btn" onclick="backToQuizSelection()">← Back to Quiz Menu</button>
            </div>
        </div>

        <!-- Tables Area -->
        <div id="tablesArea" class="tutorial-area">
            <h2 style="color: #667eea; text-align: center; margin-bottom: 20px;">📊 Math Tables (1 to 10)</h2>

            <!-- Operation Tabs -->
            <div class="tables-tab-bar">
                <button class="tables-tab active" id="tab-multiplication" onclick="showTable('multiplication')">✖️ Multiply</button>
                <button class="tables-tab" id="tab-addition" onclick="showTable('addition')">➕ Add</button>
                <button class="tables-tab" id="tab-subtraction" onclick="showTable('subtraction')">➖ Subtract</button>
                <button class="tables-tab" id="tab-division" onclick="showTable('division')">➗ Divide</button>
            </div>

            <!-- Number Selector -->
            <div class="tables-number-bar" id="tablesNumberBar"></div>

            <!-- Table Display -->
            <div id="tableDisplay"></div>

            <div style="text-align: center; margin-top: 25px;">
                <button class="btn back-btn" onclick="backFromTables()">← Back to Main Menu</button>
            </div>
        </div>

        <!-- Counting Numbers Area -->
        <div id="countingArea" class="tutorial-area">
            <h2 style="color: #667eea; text-align: center; margin-bottom: 10px;">🔢 Counting Numbers (1 to 200)</h2>
            <p style="text-align: center; color: #666; margin-bottom: 15px;">Tap any number to hear it! 🔊</p>

            <div class="counting-range-bar">
                <button class="tables-tab active" id="range-1-100" onclick="showCountingRange(1)">1 – 100</button>
                <button class="tables-tab" id="range-101-200" onclick="showCountingRange(101)">101 – 200</button>
            </div>

            <div class="voice-status" id="voiceStatus"></div>

            <div class="counting-grid" id="countingGrid"></div>

            <div style="text-align: center; margin-top: 25px;">
                <button class="btn back-btn" onclick="backFromCounting()">← Back to Main Menu</button>
            </div>
        </div>
    </div>

    <script>

            'linear-gradient(135deg,#fa709a 0%,#fee140 100%)',
            'linear-gradient(135deg,#667eea 0%,#764ba2 100%)',
            'linear-gradient(135deg,#30cfd0 0%,#330867 100%)',
            'linear-gradient(135deg,#ff9a9e 0%,#fecfef 100%)',
            'linear-gradient(135deg,#a18cd1 0%,#fbc2eb 100%)',
            'linear-gradient(135deg,#f6d365 0%,#fda085 100%)',
            'linear-gradient(135deg,#84fab0 0%,#8fd3f4 100%)'
        ];

        let currentCountingStart = 1;

        const onesWords = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
            'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
        const tensWords = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

        function numberToWords(n) {
            if (n === 200) return 'two hundred';
            if (n === 100) return 'one hundred';
            if (n > 100) {
                const rest = n - 100;
                return 'one hundred ' + numberToWords(rest);
            }
            if (n < 20) return onesWords[n];
            const t = Math.floor(n / 10);
            const o = n % 10;
            return tensWords[t] + (o ? '-' + onesWords[o] : '');
        }

        function showCountingMenu() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('countingArea').classList.add('active');
            initVoices();
            buildCountingGrid(currentCountingStart);
            document.querySelector('.container').scrollTop = 0;
        }

        function backFromCounting() {
            document.getElementById('countingArea').classList.remove('active');
            document.getElementById('mainMenu').style.display = 'grid';
            window.speechSynthesis && window.speechSynthesis.cancel();
        }

        function showCountingRange(start) {
            currentCountingStart = start;
            document.getElementById('range-1-100').classList.toggle('active', start === 1);
            document.getElementById('range-101-200').classList.toggle('active', start === 101);
            buildCountingGrid(start);
        }

        function buildCountingGrid(start) {
            const grid = document.getElementById('countingGrid');
            grid.innerHTML = '';
            const end = start + 99;
            for (let n = start; n <= end; n++) {
                const cell = document.createElement('button');
                cell.className = 'count-cell';
                cell.style.background = countingColors[(n - 1) % 10];
                cell.innerHTML = `<span class="cc-num">${n}</span><span class="cc-word">${numberToWords(n)}</span>`;
                cell.onclick = () => speakNumber(n, cell);
                grid.appendChild(cell);
            }
        }

        // ----- Text-to-speech with a female voice -----
        let cachedFemaleVoice = null;
        let voicesReady = false;

        function pickFemaleVoice() {
            const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
            if (!voices.length) return null;

            const femaleNameHints = ['female', 'woman', 'zira', 'samantha', 'susan', 'victoria', 'karen',
                'moira', 'tessa', 'fiona', 'kate', 'serena', 'ava', 'allison', 'salli', 'joanna', 'ivy',
                'kendra', 'kimberly', 'amy', 'emma', 'olivia', 'aria', 'jenny', 'sonia', 'libby', 'google us english'];

            const englishVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
            const pool = englishVoices.length ? englishVoices : voices;

            let match = pool.find(v => femaleNameHints.some(hint => v.name.toLowerCase().includes(hint)));
            if (!match) {
                // Fall back to the first English voice, or any voice
                match = pool[0];
            }
            return match || null;
        }

        function initVoices() {
            if (!window.speechSynthesis) {
                document.getElementById('voiceStatus').textContent = "Sorry, this browser can't speak numbers out loud.";
                return;
            }
            const status = document.getElementById('voiceStatus');
            const trySelect = () => {
                cachedFemaleVoice = pickFemaleVoice();
                voicesReady = true;
                status.textContent = cachedFemaleVoice ? '' : '';
            };
            trySelect();
            if (!cachedFemaleVoice) {
                window.speechSynthesis.onvoiceschanged = trySelect;
            }
        }

        function speakNumber(n, cellEl) {
            if (!window.speechSynthesis) return;

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(String(n));
            if (!cachedFemaleVoice) cachedFemaleVoice = pickFemaleVoice();
            if (cachedFemaleVoice) utterance.voice = cachedFemaleVoice;
            utterance.pitch = 1.15;
            utterance.rate = 0.85;
            utterance.lang = 'en-US';

            if (cellEl) {
                cellEl.classList.add('speaking');
                utterance.onend = () => cellEl.classList.remove('speaking');
                utterance.onerror = () => cellEl.classList.remove('speaking');
            }

            window.speechSynthesis.speak(utterance);
        }
        // ===== END COUNTING NUMBERS SECTION =====
    </script>
</body>
</html>
